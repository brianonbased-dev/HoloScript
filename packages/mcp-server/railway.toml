[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/Dockerfile.mcp-server"
# mcp-server bundles workspace deps at build time (e.g. `@holoscript/absorb-service/mcp`
# in handlers.ts) — those bundled deps MUST be watched, or a fix in them silently never
# redeploys mcp.holoscript.net. absorb-service provides the holo_* codebase/graph tools.
# HoloMeaning is uaal's runtime verifier dependency; both must trigger a rebuild
# so the deployed grader cannot retain a stale resolution contract.
# framework/** : board-task logic (claim TTL reaper, fabricated-evidence gate,
# claim cap) lives in packages/framework/src/board — a framework-only board fix
# must redeploy the board server, or the gate silently drifts.
# hololand-platform/** + runtime/** : the holo_tunnel_create MCP tool dynamically
# imports @hololand/platform-services (which pulls @holoscript/runtime) at runtime —
# a fix in either must redeploy, or the tunnel handler ships a stale/broken build.
# Includes are the builder COPY set in infrastructure/Dockerfile.mcp-server plus
# root workspace manifests (pnpm-lock.yaml, pnpm-workspace.yaml, package.json).
# mesh declares many plugin workspace deps; only the three plugins this Dockerfile
# COPY's are watched, because the others never enter the image.
# Negations are gitignore-style and must follow an include rule
# (https://docs.railway.com/builds/build-configuration#configure-watch-paths).
watchPatterns = [
  "packages/mcp-server/**",
  "packages/core/**",
  "packages/core-types/**",
  "packages/crdt/**",
  "packages/crdt-spatial/**",
  "packages/agent-protocol/**",
  "packages/compiler-wasm/**",
  "packages/meaning/**",
  "packages/uaal/**",
  "packages/hololand-platform/**",
  "packages/runtime/**",
  "packages/holomap/**",
  "packages/snn-webgpu/**",
  "packages/engine/**",
  "packages/framework/**",
  "packages/cli/**",
  "packages/llm-provider/**",
  "packages/config/**",
  "packages/holoembed/**",
  "packages/secrets-broker/**",
  "packages/memory/**",
  "packages/absorb-service/**",
  "packages/platform/**",
  "packages/marketplace-api/**",
  "packages/mesh/**",
  "packages/holo-vm/**",
  "packages/security-sandbox/**",
  "packages/plugins/energy-grid-plugin/**",
  "packages/plugins/fitness-wellness-plugin/**",
  "packages/plugins/travel-hospitality-plugin/**",
  "scripts/docker/**",
  "infrastructure/Dockerfile.mcp-server",
  "packages/mcp-server/railway.toml",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/.npmrc",
  "/tsconfig.json",
  "/tsconfig.base.json",
  # Manifests stage copies every workspace package.json and tsconfig*.json
  # under packages/, services/, and benchmarks/ (not their source).
  "packages/**/package.json",
  "services/**/package.json",
  "benchmarks/**/package.json",
  "packages/**/tsconfig*.json",
  "services/**/tsconfig*.json",
  "benchmarks/**/tsconfig*.json",
  "!**/*.md",
  "!docs/**",
  "!research/**",
]

[deploy]
healthcheckPath = "/health"
# Was 30s. The process does not listen until the entrypoint finishes its SQL
# migration and http-server.ts finishes vault hydration (load-env import),
# tool-module import, initStores, mesh-registry restore, and attestation
# hydration. The in-file keep-alive note cites ~14s once the process is up;
# 30s does not cover a slow Postgres round-trip plus that import. 120s is
# above the 100s already used by infrastructure/railway.mcp-server.toml and
# still under Railway's 300s platform default.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "3000"
MCP_SERVER_SIZE = "standard"
# P.009 — keep container warm to prevent ~14s cold-start on first MCP initialize.
# Railway sleeps containers after ~5 min idle; self-ping at 4.5 min keeps it live.
MCP_KEEP_ALIVE_ENABLED = "true"
MCP_KEEP_ALIVE_INTERVAL_MS = "270000"
# Data dir comes from the code default when HOLOMESH_DATA_DIR is unset
# (state.ts:37-42): $HOLOSCRIPT_CACHE_DIR/holomesh. The image sets that cache
# dir to /app/.holoscript (WORKDIR /app), so the path is /app/.holoscript/holomesh.
# Live volume is /app/.holoscript.
# Lane B (SSE): shorten heartbeats if proxies drop idle streams (ms, 5000–55000).
# HOLOMESH_SSE_HEARTBEAT_MS = "15000"
# Classic MCP SSE on Railway needs one replica or sticky routing; default is streamable HTTP.
# MCP_ENABLE_SSE = "true"
