[build]
# Dockerfile (not NIXPACKS): the monorepo's transitive closure pulls broken
# sibling packages (alphafold-plugin TS errors) and native gyp deps; the curated
# Dockerfile builds only marketplace-api's real closure with --ignore-scripts.
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/Dockerfile.marketplace-api"
watchPatterns = ["packages/marketplace-api/**", "packages/registry/**", "packages/core/**", "infrastructure/Dockerfile.marketplace-api"]

[deploy]
# start handled by the Dockerfile CMD (node packages/marketplace-api/dist/server.js)
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_VERSION = "20"
CORS_ORIGINS = "https://marketplace-web-production-424e.up.railway.app"
TRUST_PROXY = "true"
# DATABASE_URL is set in Railway dashboard via the Postgres service reference variable
