        // vertical stem to ground so tier-height is readable
        const stem = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([pos[c.id], new THREE.Vector3(c.x, -2, c.z)]),
          new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.12 })
        );
        scene.add(stem);
      });
      function makeLines(pairs, color, op, dash) {
        const g = new THREE.BufferGeometry();
        const pts = [];
        pairs.forEach((e) => {
          const a = pos[e[0]],
            b = pos[e[1]];
          if (a && b) {
            pts.push(a.x, a.y, a.z, b.x, b.y, b.z);
          }
        });
        g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        const mat = dash
          ? new THREE.LineDashedMaterial({
              color,
              transparent: true,
              opacity: op,
              dashSize: 3,
              gapSize: 3,
            })
          : new THREE.LineBasicMaterial({ color, transparent: true, opacity: op });
        const ls = new THREE.LineSegments(g, mat);
        if (dash) ls.computeLineDistances();
        return ls;
      }
      const linGrp = makeLines(D.lineage, 0x66ffcc, 0.5, false);
      scene.add(linGrp);
      const brGrp = makeLines(
        D.bridges.map((b) => [b[0], b[1]]),
        0xff4488,
        0.5,
        true
      );
      brGrp.visible = false;
      scene.add(brGrp);
      document.getElementById('cLin').onchange = (e) => (linGrp.visible = e.target.checked);
      document.getElementById('cBridge').onchange = (e) => (brGrp.visible = e.target.checked);
      // hover tooltip
      const ray = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tip = document.getElementById('tip');
      addEventListener('pointermove', (ev) => {
        mouse.x = (ev.clientX / innerWidth) * 2 - 1;
        mouse.y = -(ev.clientY / innerHeight) * 2 + 1;
        ray.setFromCamera(mouse, cam);
        const hit = ray.intersectObjects(pick)[0];
        if (hit) {
          const c = hit.object.userData;
          tip.style.display = 'block';
          tip.style.left = ev.clientX + 12 + 'px';
          tip.style.top = ev.clientY + 12 + 'px';
          tip.innerHTML =
            '<b>' +
            c.id +
            '</b> [' +
            c.tier +
            ']<br>' +
            (c.title || '') +
            '<br><span style="color:#888">cited ' +
            (c.lineage_in || 0) +
            '× · cites ' +
            (c.lineage_out || 0) +
            '× · ' +
            (c.domain || '') +
            '</span>';
        } else tip.style.display = 'none';
      });
      addEventListener('resize', () => {
        cam.aspect = innerWidth / innerHeight;
        cam.updateProjectionMatrix();
        rnd.setSize(innerWidth, innerHeight);
      });
      (function loop() {
        requestAnimationFrame(loop);
        ctr.update();
        rnd.render(scene, cam);
      })();
    </script>
  </body>
</html>
