name: gitleaks

# Always-on secret scanning. This repo's local pre-commit hook (.githooks/pre-commit)
# has NO secret scan — which is how a classic-sk OPENAI_API_KEY reached tracked
# .env.docker. CI gitleaks is the primary secret gate here: every push/PR plus a
# weekly full-history sweep, independent of Railway deploys (F.102) and local hooks.
#
# 5th secret-leak incident (F.106). A RED run is the loud tripwire (W.679).

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # Mon 09:00 UTC — weekly full-history sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the sweep sees every commit
      - name: Install gitleaks
        run: |
          GL_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan (full history, redacted — never prints secret values)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
