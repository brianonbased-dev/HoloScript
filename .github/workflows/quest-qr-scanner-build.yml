name: Quest QR Scanner — build APK

# Cloud build path for the Universal QR Scanner immersive-MR app (no local Android toolchain needed).
# Builds the committed @generated app under android-mr/ — every .kt there is generated from
# scanner.holo by the in-core QuestCompiler (surface: immersive_mr); the pre-commit golden gate
# (check-quest-mr-emit-matches-reference.mts) guards that android-mr stays in sync with the spec.
# Produces a debug APK; the signed release + store submit is the founder-gated Phase 3.
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/quest-universal-qr-scanner/**'
      - '.github/workflows/quest-qr-scanner-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (immersive-MR, Meta Spatial SDK)
        working-directory: apps/quest-universal-qr-scanner/android-mr
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-qr-scanner-apk
          path: |
            apps/quest-universal-qr-scanner/android-mr/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
