name: Paper 26 Gates — HoloGraph & HoloEmbed

# Validates the two core Paper 26 packages before merge.
# HoloGraph (S.HGRAPH): 10/10 tests in absorb-service — recall=1.000 exact-by-construction
# HoloEmbed (S.HEMBED): 32/32 tests in holoembed — 90.0% NL recall@10
#
# Triggered on: PRs touching either package, and push to main.
on:
  push:
    branches: [main]
    paths:
      - 'packages/absorb-service/**'
      - 'packages/holoembed/**'
  pull_request:
    paths:
      - 'packages/absorb-service/**'
      - 'packages/holoembed/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holoembed-gate:
    name: HoloEmbed — 32/32 tests (S.HEMBED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @holoscript/holoembed
        run: pnpm --filter @holoscript/holoembed build

      - name: Run HoloEmbed tests (S.HEMBED — 768-dim NL→code embeddings)
        working-directory: packages/holoembed
        run: npx vitest run --passWithNoTests

      - name: Verify publish config
        working-directory: packages/holoembed
        run: |
          node -e "
          const pkg = require('./package.json');
          const required = ['name','version','main','types','exports','files','license','repository','engines'];
          const missing = required.filter(k => !pkg[k]);
          if (missing.length) {
            console.error('Missing npm publish fields:', missing.join(', '));
            process.exit(1);
          }
          if (pkg.license === 'UNLICENSED') {
            console.error('license is UNLICENSED — set to MIT before publish');
            process.exit(1);
          }
          console.log('publish config OK:', required.map(k => k + '=' + JSON.stringify(pkg[k])).join(', '));
          "

  holograph-gate:
    name: HoloGraph — 10/10 Paper26 tests (S.HGRAPH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @holoscript/absorb-service
        run: pnpm --filter @holoscript/absorb-service build

      - name: Run HoloGraph Paper26 tests (recall=1.000 exact-by-construction)
        working-directory: packages/absorb-service
        run: |
          npx vitest run \
            src/engine/__tests__/Paper26Benchmark.test.ts \
            src/engine/__tests__/Paper26Table2NLRecall.test.ts

      - name: Verify publish config
        working-directory: packages/absorb-service
        run: |
          node -e "
          const pkg = require('./package.json');
          const required = ['name','version','main','types','exports','files','license','repository','engines'];
          const missing = required.filter(k => !pkg[k]);
          if (missing.length) {
            console.error('Missing npm publish fields:', missing.join(', '));
            process.exit(1);
          }
          console.log('publish config OK:', required.map(k => k + '=' + JSON.stringify(pkg[k])).join(', '));
          "

      - name: Write Paper26 gate summary
        if: always()
        run: |
          echo "## Paper 26 Gate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Tests | Claim |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| @holoscript/absorb-service (HoloGraph) | 10 Paper26 tests | recall=1.000 exact-by-construction |" >> "$GITHUB_STEP_SUMMARY"
          echo "| @holoscript/holoembed (HoloEmbed) | 32 tests | 90.0% NL recall@10 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Provenance: research/paper-26-benchmark-provenance-2026-05-21.txt" >> "$GITHUB_STEP_SUMMARY"
