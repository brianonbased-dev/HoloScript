packages:
  - 'packages/*'
  - 'packages/plugins/*'
  - 'services/*'
  - 'benchmarks/*'

# Fail before a global pnpm can mutate install state when packageManager pins a different pnpm.
pmOnFail: error

peerDependencyRules:
  ignoreMissing:
    - '@neondatabase/serverless'

overrides:
  hono: '>=4.12.14'
  '@hono/node-server': '>=1.19.13'
  axios: '>=1.16.0'
  follow-redirects: '>=1.16.0'
  dompurify: '>=3.4.0'
  glob: ^13.0.6
  minimatch: '>=9.0.7'
  qs: '>=6.15.0'
  markdown-it: '>=14.1.1'
  '@x402/svm': '>=2.9.0'
  brace-expansion: '>=5.0.5'
  picomatch: '>=4.0.4'
  monaco-editor: 0.55.1
  yaml: '>=2.8.3'
  terser-webpack-plugin: '>=5.4.0'
  lodash-es: '>=4.18.1'
  lodash: '>=4.18.1'
  defu: '>=6.1.6'
  undici: '>=7.24.0'
  jsdom@28.1.0>undici: 7.28.0
  flatted: '>=3.4.2'
  rollup: '>=4.59.0'
  serialize-javascript: '>=7.0.3'
  parse-duration: '>=2.1.3'
  underscore: '>=1.13.8'
  h3: '>=1.15.6'
  socket.io-parser: '>=4.2.6'
  '@modelcontextprotocol/sdk': ^1.27.1
  tree-sitter: ^0.22.4
  path-to-regexp@<1: 0.1.13
  esbuild: ^0.27.3
  nanoid: '>=5.0.9'
  bn.js: '>=4.12.3'
  next: '>=16.2.7'
  '@apollo/server': '>=5.5.0'
  elliptic: '>=6.6.1'
  bigint-buffer: '>=1.1.5'
  three: ^0.182.0
  '@react-three/fiber': ^9.5.0
  '@types/react': 19.2.14
  protobufjs: '>=8.0.2'
  vite: '>=7.3.2'
  drizzle-orm: '>=0.45.2'
  basic-ftp: '>=5.3.1'
  fast-uri: '>=3.1.2'
  fast-xml-builder: '>=1.1.7'
  tmp: '>=0.2.6'
  zod: '>=4.4.3'

auditConfig:
  ignoreGhsas:
    - GHSA-3gc7-fjrx-p6mg

allowBuilds:
  '@apollo/protobufjs': true
  '@coinbase/x402': false
  '@opensea/seaport-js': false
  '@vscode/vsce-sign': false
  better-sqlite3: true
  bigint-buffer: true
  bufferutil: true
  cbor-extract: true
  core-js: false
  esbuild: true
  ffmpeg-static: false
  keccak: true
  keytar: false
  leveldown: true
  onnxruntime-node: false
  opensea-js: false
  puppeteer: false
  secp256k1: true
  sharp: true
  tree-sitter: true
  tree-sitter-cli: true
  tree-sitter-go: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: true
  utf-8-validate: true
  webgpu: true

ignoredBuiltDependencies:
  - '@coinbase/x402'
  - '@opensea/seaport-js'
  - '@vscode/vsce-sign'
  - core-js
  - ffmpeg-static
  - keytar
  - onnxruntime-node
  - opensea-js
  - puppeteer
